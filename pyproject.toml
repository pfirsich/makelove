[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
include = ["makelove"]

[project]
name = "makelove"
version = "0.0.14"
dependencies = [
    "Pillow>=7.0",
    "appdirs>=1.4.3",
    "toml>=0.10",
]
requires-python = ">=3.8"
authors = [
    { name = "Joel Schumacher", email = "joelschum@gmail.com" },
    { name = "Josh Perry", email = "joshperry@outlook.com" },
]
maintainers = [
    { name = "Joel Schumacher", email = "joelschum@gmail.com" },
    { name = "Josh Perry", email = "joshperry@outlook.com" },
]
description = "A packaging tool for [löve](https://love2d.org) games"
readme = "README.md"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Games/Entertainment :: Build Tools",
]

[project.urls]
Repository = "https://github.com/pfirsich/makelove"

[project.scripts]
makelove = "makelove.makelove:main"

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
ignore = ["E731"]

[dependency-groups]
dev = [
    "build>=1.2.2.post1",
]
