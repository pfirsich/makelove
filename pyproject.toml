[project]
name = "makelove"
version = "0.1.0"
description = "A packaging tool for [löve](https://love2d.org) games"
authors = [
    {name = "Joel Schumacher", email = "joelschum@gmail.com"},
]
dependencies = [
    "setuptools>=68.0.0",
    "Pillow>=7.0",
    "appdirs>=1.4.3",
    "toml>=0.10"
]
requires-python = ">=3.7"
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
makelove = "makelove.makelove:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

